name: Yakutsk SDR Monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch status
        run: |
          mkdir -p data
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o data/status.txt --max-time 15 "http://yakutsk.proxy2.kiwisdr.com/status" || echo "000")
          echo "HTTP $HTTP_CODE"
          head -20 data/status.txt
      - name: Generate report
        run: python3 scripts/analyze.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: 更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
